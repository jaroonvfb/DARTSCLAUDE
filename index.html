<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Darts 301 / 501</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#24343f,#0b1116 75%);color:#f4efe2;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
#hud{display:flex;gap:22px;align-items:center;justify-content:center}
.box{text-align:center}
.lbl{font-size:13px;opacity:.65}
.big{font-size:46px;font-weight:900;line-height:1;color:#ffd400}
#darts span{display:inline-block;width:15px;height:15px;border-radius:50%;background:#2b3640;margin:4px 3px 0}
#darts span.on{background:#ffd400;box-shadow:0 0 10px #ffd400}
#last{font-size:20px;font-weight:700;min-height:26px}
canvas{width:min(96vw,62vh);height:min(96vw,62vh);width:min(96vw,62dvh);height:min(96vw,62dvh);display:block}
#msg{font-size:19px;font-weight:700;min-height:26px;color:#ff6a3d}
#ov{position:fixed;inset:0;background:rgba(6,10,14,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center;padding:20px}
#ov h1{font-size:clamp(44px,12vw,84px);margin:0;letter-spacing:.04em}
#ov p{margin:0;font-size:20px;opacity:.85}
.row{display:flex;gap:16px}
button{font:inherit;font-size:34px;font-weight:900;padding:16px 38px;border:0;border-radius:14px;background:#d8281e;color:#fff;cursor:pointer;box-shadow:0 6px 0 #7d140e}
button.g{background:#13874a;box-shadow:0 6px 0 #0a4d2a}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
#menu{position:fixed;top:10px;right:10px;font-size:16px;padding:8px 16px;border-radius:10px;background:#2b3640;box-shadow:0 3px 0 #11181e;z-index:3}
#ov{overflow:auto}
#stats{margin-top:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:14px 20px;min-width:min(88vw,380px)}
#stats h2{margin:0 0 8px;font-size:20px}
#stats table{width:100%;border-collapse:collapse;font-size:18px}
#stats th{font-size:13px;opacity:.6;font-weight:600;padding-bottom:4px}
#stats td,#stats th{text-align:right;padding:5px 4px}
#stats td:first-child,#stats th:first-child{text-align:left}
#stats td:not(:first-child){font-weight:800;color:#ffd400}
#vol{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:700}
#vol input{width:min(50vw,220px);accent-color:#ffd400}
#gnote{font-size:12px;opacity:.55;margin-top:6px}
#cel{position:fixed;inset:0;width:100%;height:100%;z-index:4;display:none;pointer-events:none;background:#000}
#tens{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10vh;background:radial-gradient(circle,transparent 25%,rgba(130,0,12,.9) 100%)}
#heart{font-size:84px;color:#ff2d3d;text-shadow:0 0 24px #ff2d3d}
#bpm{font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}
#pun{position:fixed;inset:0;width:100%;height:100%;z-index:4;display:none;pointer-events:none;background:#000}
</style>
</head>
<body>
<button id="menu">Menü</button>
<div id="tens"><div id="heart">❤</div><div id="bpm">80 BPM</div></div>
<div id="app">
  <div id="hud">
    <div class="box"><div class="lbl">Rest</div><div class="big" id="rem">501</div></div>
    <div class="box"><div class="lbl">Darts in dieser Runde</div><div id="darts"><span></span><span></span><span></span></div><div class="lbl" id="tot">Darts total: 0</div></div>
  </div>
  <div id="last">&nbsp;</div>
  <canvas id="c"></canvas>
  <div id="msg">&nbsp;</div>
</div>
<div id="ov">
  <h1>🎯 DARTS</h1>
  <p id="ovt">Wähle dein Spiel. Double-Out: Du musst mit einem Doppel auf 0 gehen.</p>
  <div class="row"><button class="g" data-m="301">301</button><button data-m="501">501</button></div>
  <div id="vol"><label for="volr">🔊 Musik</label><input id="volr" type="range" min="0" max="100" value="60"></div>
  <div id="stats">
    <h2>Statistiken</h2>
    <table>
      <tr><th></th><th>Du</th><th>Alle Spieler</th></tr>
      <tr><td>Darts geworfen</td><td id="s-darts">0</td><td id="g-darts">–</td></tr>
      <tr><td>180er</td><td id="s-180">0</td><td id="g-180">–</td></tr>
      <tr><td>9-Darter (501)</td><td id="s-nine">0</td><td id="g-nine">–</td></tr>
    </table>
    <div id="gnote"></div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const L=700,C=350,S=1.75,DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=cv.height=L*DPR;
const RB=8,RO=22,T1=101,T2=115,D1=155,D2=169;
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const A0=-Math.PI/2,SEG=Math.PI/10,RC=322,ORB=(T2+D1)/2*S;

/* ---------- Dartboard einmal vorzeichnen ---------- */
const board=document.createElement('canvas');board.width=board.height=L*DPR;
(function(){
  const g=board.getContext('2d');g.scale(DPR,DPR);
  const ring=(r1,r2,a,b,col)=>{g.beginPath();g.arc(C,C,r2*S,a,b);g.arc(C,C,r1*S,b,a,true);g.closePath();g.fillStyle=col;g.fill();};
  g.fillStyle='#050505';g.beginPath();g.arc(C,C,346,0,7);g.fill();
  g.lineWidth=4;g.strokeStyle='#8a8f94';g.stroke();
  for(let i=0;i<20;i++){
    const a=A0+i*SEG-SEG/2,b=a+SEG,ev=i%2===0;
    const si=ev?'#141414':'#f0e2bf',sp=ev?'#d8281e':'#13874a';
    ring(RO,T1,a,b,si);ring(T1,T2,a,b,sp);ring(T2,D1,a,b,si);ring(D1,D2,a,b,sp);
  }
  g.fillStyle='#13874a';g.beginPath();g.arc(C,C,RO*S,0,7);g.fill();
  g.fillStyle='#d8281e';g.beginPath();g.arc(C,C,RB*S,0,7);g.fill();
  g.strokeStyle='#c9ced2';g.lineWidth=1.4;
  [RB,RO,T1,T2,D1,D2].forEach(r=>{g.beginPath();g.arc(C,C,r*S,0,7);g.stroke();});
  for(let i=0;i<20;i++){const a=A0+i*SEG-SEG/2;g.beginPath();g.moveTo(C+Math.cos(a)*RO*S,C+Math.sin(a)*RO*S);g.lineTo(C+Math.cos(a)*D2*S,C+Math.sin(a)*D2*S);g.stroke();}
  g.fillStyle='#fff';g.font='bold 36px "Trebuchet MS",Verdana,sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<20;i++){const a=A0+i*SEG;g.fillText(ORDER[i],C+Math.cos(a)*RC,C+Math.sin(a)*RC+2);}
})();

/* ---------- Spielzustand ---------- */
let rem=501,turnStart=501,phase='menu',phaseT=0,lockAng=0,turn=[],stuck=[],total=0,
    fx=[],waves=[],texts=[],trail=[],shake=0,flash=0,flight=null,pulling=0,xy={x:C,y:C},timer=0,mode=501;

function setPhase(p){phase=p;phaseT=0;
  $('msg').innerHTML=p==='angle'?'Tippen: Richtung stoppen':p==='radial'?'Tippen: Wurfweite stoppen':'&nbsp;';}
function hud(){
  $('rem').textContent=rem;$('tot').textContent='Darts total: '+total;
  [...$('darts').children].forEach((s,i)=>s.classList.toggle('on',i<turn.length));
}
function start(m){clutch=false;EIGHTH=0.17;mode=m;rem=turnStart=m;turn=[];stuck=[];total=0;fx=[];texts=[];waves=[];
  $('last').innerHTML='&nbsp;';$('ov').style.display='none';hud();setPhase('angle');}
document.querySelectorAll('#ov button').forEach(b=>b.onclick=e=>{e.stopPropagation();start(+b.dataset.m);});
$('menu').onclick=e=>{e.stopPropagation();celT=-1;cel.style.display='none';setAnthem(0);punT=-1;pun.style.display='none';tensT=-1;$('tens').style.opacity=0;$('tens').style.display='none';$('app').style.transform='';clutch=false;EIGHTH=0.17;flight=null;pulling=0;phase='menu';
  $('ovt').textContent='Wähle dein Spiel. Double-Out: Du musst mit einem Doppel auf 0 gehen.';
  $('ov').style.display='flex';showStats();};

/* ---------- Statistiken (lokal + weltweit) ---------- */
const NS='darts-ghpages-spiel',API='https://api.counterapi.dev/v1/'+NS+'/';
const KEYS={darts:'darts',n180:'180er',nine:'neundarter'};
let my={darts:0,n180:0,nine:0};
try{my=Object.assign(my,JSON.parse(localStorage.getItem('dartsStats')||'{}'));}catch(e){}
function addStat(k){
  my[k]++;try{localStorage.setItem('dartsStats',JSON.stringify(my));}catch(e){}
  fetch(API+KEYS[k]+'/up').catch(()=>{});
}
async function showStats(){
  $('s-darts').textContent=my.darts;$('s-180').textContent=my.n180;$('s-nine').textContent=my.nine;
  let ok=0;
  for(const [k,id] of [['darts','g-darts'],['n180','g-180'],['nine','g-nine']]){
    try{const r=await fetch(API+KEYS[k]);const j=await r.json();$(id).textContent=j.count!=null?j.count:0;ok++;}
    catch(e){$(id).textContent=ok?'0':'–';}
  }
  $('gnote').textContent=ok?'':'Weltweite Zahlen sind gerade nicht erreichbar.';
}
showStats();

/* ---------- Pub-Musik (Jig im 6/8-Takt, per WebAudio erzeugt) ---------- */
const BARS=[
 [[66,1],[69,1],[74,1],[74,1],[73,1],[74,1]],
 [[76,1],[74,1],[69,1],[66,1],[69,1],[74,1]],
 [[71,1],[74,1],[71,1],[67,1],[71,1],[74,1]],
 [[73,1],[76,1],[73,1],[69,1],[73,1],[76,1]],
 [[74,2],[66,1],[69,2],[66,1]],
 [[71,1],[74,1],[78,1],[74,1],[71,1],[66,1]],
 [[67,1],[71,1],[74,1],[71,1],[67,1],[71,1]],
 [[73,1],[69,1],[73,1],[74,3]]];
const CH=[[50,[62,66,69]],[50,[62,66,69]],[55,[59,62,67]],[57,[61,64,69]],[50,[62,66,69]],[47,[59,62,66]],[55,[59,62,67]],[57,[61,64,69]]];
const MEL={};{let st=0;BARS.forEach(b=>b.forEach(n=>{MEL[st]=n;st+=n[1];}));}
let EIGHTH=0.17;const fq=m=>440*Math.pow(2,(m-69)/12);
let ac=null,master=null,noiseBuf=null,nextT=0,stepI=0,vol=0.6;
try{const v=localStorage.getItem('dartsVol');if(v!==null)vol=+v;}catch(e){}
$('volr').value=Math.round(vol*100);
function tone(type,m,t,dur,v,cut){
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type=type;o.frequency.value=fq(m);f.type='lowpass';f.frequency.value=cut;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function tick(t,v){
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=5000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const AD=0.117,ACH=[[45,[57,60,64]],[41,[53,57,60]],[48,[55,60,64]],[43,[55,59,62]]];
const LEAD=[[[0,76,3],[4,79,3],[8,76,4],[12,72,4]],[[0,77,3],[4,81,3],[8,77,4],[12,72,4]],[[0,79,3],[4,84,3],[8,79,4],[12,76,4]],[[0,79,2],[3,77,2],[6,76,2],[8,74,8]]];
let musicMode=0,aI=0;
function setAnthem(on){musicMode=on;aI=0;}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);}
function annStep(t){
  const st=aI%16,bar=Math.floor(aI/16)%4,root=ACH[bar][0],ch=ACH[bar][1];
  if(st%4===0)kick(t);
  if(st===4||st===12)tick(t,.5);
  if(st%4===2)tick(t,.25);
  if(st%2===0)tone('sawtooth',root,t,AD*1.7,.3,500);
  tone('sawtooth',ch[[0,1,2,1,2,1,0,1][st%8]]+(st%8>=4?12:0),t,AD*.9,.11,2400);
  if(st===0)ch.forEach(n=>tone('triangle',n,t,AD*15,.07,900));
  LEAD[bar].forEach(l=>{if(l[0]===st)tone('sawtooth',l[1],t,l[2]*AD,.14,3000);});
}
function sched(){
  while(nextT<ac.currentTime+0.25){
    if(musicMode){annStep(nextT);aI++;nextT+=AD;continue;}
    const bar=Math.floor(stepI/6)%8,b=stepI%6,m=MEL[stepI];
    if(m)tone('sawtooth',m[0],nextT,m[1]*EIGHTH*0.95,0.2,2600);
    if(b===0)tone('triangle',CH[bar][0],nextT,EIGHTH*2.4,0.55,600);
    if(b===3)CH[bar][1].forEach(n=>tone('square',n-12,nextT,EIGHTH*1.5,0.06,1300));
    tick(nextT,b%3===0?0.22:0.07);
    nextT+=EIGHTH;stepI=(stepI+1)%48;
  }
}
function ensureAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!ac){
    ac=new AC();master=ac.createGain();master.gain.value=vol*0.6;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.1,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=ac.currentTime+0.1;setInterval(sched,50);
  }
  if(ac.state==='suspended')ac.resume();
}
$('volr').addEventListener('input',e=>{
  vol=e.target.value/100;ensureAudio();if(master)master.gain.value=vol*0.6;
  try{localStorage.setItem('dartsVol',vol);}catch(x){}
});
['pointerdown','touchend','click'].forEach(ev=>addEventListener(ev,ensureAudio));
addEventListener('keydown',ensureAudio);

/* ---------- Eingabe ---------- */
function tap(){
  if(celT>=0){if(celT>2){celT=99;timer=Math.min(timer,0.3);}return;}
  if(phaseT<0.15)return;
  if(phase==='angle'){lockAng=curAng();setPhase('radial');}
  else if(phase==='radial'){
    const r=curR();xy={x:C+Math.cos(lockAng)*r,y:C+Math.sin(lockAng)*r};
    flight={t:0,x:xy.x,y:xy.y};trail=[];setPhase('flying');
  }
}
let lastTap=0;
function gameTap(e){
  if(e.target.closest&&e.target.closest('#ov,#menu'))return;
  const n=performance.now();if(n-lastTap<60)return;lastTap=n;
  if(e.cancelable)e.preventDefault();
  tap();
}
addEventListener('touchstart',gameTap,{passive:false});
addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')gameTap(e);});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap();}});

/* ---------- Fadenkreuz-Bewegung ---------- */
const DW=0.18,MV=0.07,CY=DW+MV;
function curAng(){
  const k=Math.floor(phaseT/CY),f=phaseT%CY;
  let u=f<DW?0:(f-DW)/MV;u=u*u*(3-2*u);
  return A0-(k+u)*SEG;
}
function curR(){const p=Math.floor(phaseT/(clutch?0.063:0.07))%18,k=p<10?p:18-p;return k*18*S;}

/* ---------- Wertung ---------- */
function score(x,y){
  const dx=x-C,dy=y-C,r=Math.hypot(dx,dy)/S;
  if(r<=RB)return{pts:50,dbl:true,lab:'Bullseye',big:'BULLSEYE!',col:'#ff3b30'};
  if(r<=RO)return{pts:25,dbl:false,lab:'25',big:'',col:'#2ecc71'};
  if(r>D2)return{pts:0,dbl:false,lab:'Daneben',big:'',col:'#aaa'};
  let d=(Math.atan2(dy,dx)*180/Math.PI+90+9+720)%360;
  const n=ORDER[Math.floor(d/18)%20];
  if(r>=D1)return{pts:n*2,dbl:true,lab:'D'+n,big:'DOUBLE '+n+'!',col:'#ff5a4d'};
  if(r>=T1&&r<=T2)return{pts:n*3,dbl:false,lab:'T'+n,big:'TRIPLE '+n+'!',col:'#ffd400'};
  return{pts:n,dbl:false,lab:'S'+n,big:'',col:'#fff'};
}

/* ---------- Effekte ---------- */
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(0.3+Math.random())*sp;
  fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:0.5+Math.random()*0.6,col,sz:2+Math.random()*4});}}
function pop(t,x,y,col,big){texts.push({t,x,y,col,big,age:0});}

function impact(){
  const s=score(flight.x,flight.y);
  stuck.push({x:flight.x,y:flight.y,vy:0,a:0});
  total++;turn.push(s);addStat('darts');
  shake=s.big?26:15;
  waves.push({x:flight.x,y:flight.y,age:0,col:s.col});
  burst(flight.x,flight.y,s.col,s.big?50:24,s.big?420:260);
  burst(flight.x,flight.y,'#fff',10,200);
  pop(s.lab+(s.pts?'  +'+s.pts:''),flight.x,flight.y-34,s.col,false);
  if(s.big){pop(s.big,C,C-80,s.col,true);flash=s.pts===50?1:0.45;}
  $('last').innerHTML='Letzter Wurf: <span style="color:'+s.col+'">'+s.lab+' ('+s.pts+')</span>';

  const wasClutch=clutch;clutch=false;EIGHTH=0.17;const nr=rem-s.pts;let bust=false,win=false;
  if(nr<0||nr===1||(nr===0&&!s.dbl))bust=true;
  else if(nr===0)win=true;
  else rem=nr;
  flight=null;hud();
  if(wasClutch&&!win){setPhase('wait');phase='punch';setTimeout(()=>{if(phase==='punch')startPunch();},1100);return;}
  if(win){rem=0;hud();if(mode===501&&total===9){addStat('nine');pop('9-DARTER!',C,C-150,'#ff3b30',true);}pop('GEWONNEN!',C,C+10,'#ffd400',true);
    for(let i=0;i<6;i++)setTimeout(()=>burst(80+Math.random()*540,100+Math.random()*300,['#ffd400','#ff3b30','#2ecc71','#4aa3ff'][i%4],70,500),i*220);
    setPhase('wait');timer=2.6;phase='won';if(mode===501&&total===9){timer=12.4;setTimeout(()=>{if(phase==='won')startCel();},1400);}return;}
  if(bust){rem=turnStart;pop('BUST!',C,C-80,'#ff3b30',true);shake=30;hud();setPhase('wait');timer=1.3;phase='endturn';return;}
  if(turn.length>=3){
    if(turn.reduce((a,t)=>a+t.pts,0)===180){addStat('n180');pop('180!',C,C-150,'#ffd400',true);burst(C,C,'#ffd400',70,500);flash=0.5;}
    setPhase('wait');timer=1.1;phase='endturn';return;}
  if(mode===501&&total===8&&(rem===50||(rem<=40&&rem%2===0)))return startTension();
  setPhase('angle');
}

/* ---------- Zeichnen ---------- */
function cross(x,y,col,s){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.lineWidth=3.5*s;
  ctx.beginPath();ctx.arc(0,0,17*s,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-30*s,0);ctx.lineTo(-7*s,0);ctx.moveTo(30*s,0);ctx.lineTo(7*s,0);
  ctx.moveTo(0,-30*s);ctx.lineTo(0,-7*s);ctx.moveTo(0,30*s);ctx.lineTo(0,7*s);ctx.stroke();
  ctx.restore();
}
function dart(x,y,sc,al){
  ctx.save();ctx.globalAlpha=al==null?1:al;ctx.translate(x,y);ctx.rotate(0.95);ctx.scale(sc,sc);
  ctx.fillStyle='#d9dde0';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(16,-3.2);ctx.lineTo(16,3.2);ctx.fill();
  ctx.fillStyle='#e8b923';ctx.fillRect(16,-4.5,38,9);
  ctx.fillStyle='#8a6a10';for(let i=0;i<5;i++)ctx.fillRect(21+i*7,-4.5,2,9);
  ctx.fillStyle='#222';ctx.fillRect(54,-2,16,4);
  ctx.fillStyle='#d8281e';ctx.beginPath();ctx.moveTo(66,0);ctx.lineTo(92,-18);ctx.lineTo(96,-2);ctx.fill();
  ctx.fillStyle='#a31a12';ctx.beginPath();ctx.moveTo(66,0);ctx.lineTo(92,18);ctx.lineTo(96,2);ctx.fill();
  ctx.restore();
}
function dashLine(){
  ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,212,0,.55)';ctx.lineWidth=2;

  g.strokeStyle='#0d0d13';g.lineWidth=.08*u;g.beginPath();g.moveTo(gx-.06*u,y0-.45*u);g.lineTo(gx-.07*u+sw,y0-.02*u);g.moveTo(gx+.06*u,y0-.45*u);g.lineTo(gx+.07*u-sw,y0-.02*u);g.stroke();
  g.fillStyle='#050505';g.beginPath();g.ellipse(gx-.07*u+sw,y0,.07*u,.022*u,0,0,7);g.ellipse(gx+.07*u-sw,y0,.07*u,.022*u,0,0,7);g.fill();
  g.fillStyle=suit;g.beginPath();g.moveTo(gx-.17*u,y0-.82*u);g.lineTo(gx+.17*u,y0-.82*u);g.lineTo(gx+.13*u,y0-.42*u);g.lineTo(gx-.13*u,y0-.42*u);g.fill();
  g.fillStyle='#f4f4f4';g.beginPath();g.moveTo(gx-.05*u,y0-.82*u);g.lineTo(gx+.05*u,y0-.82*u);g.lineTo(gx,y0-.62*u);g.fill();
  g.fillStyle='#a8101e';g.beginPath();g.moveTo(gx-.014*u,y0-.8*u);g.lineTo(gx+.014*u,y0-.8*u);g.lineTo(gx+.022*u,y0-.6*u);g.lineTo(gx,y0-.56*u);g.lineTo(gx-.022*u,y0-.6*u);g.fill();
  g.fillStyle='#e0ac82';g.fillRect(gx-.03*u,y0-.86*u,.06*u,.05*u);g.beginPath();g.arc(gx,y0-.93*u,.075*u,0,7);g.fill();
  g.fillStyle='#1a1109';g.beginPath();g.arc(gx,y0-.945*u,.078*u,Math.PI,0);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(gx-.03*u,y0-.925*u,.008*u,0,7);g.arc(gx+.03*u,y0-.925*u,.008*u,0,7);g.fill();
  g.strokeStyle='#111';g.lineWidth=.008*u;g.beginPath();g.moveTo(gx-.05*u,y0-.95*u);g.lineTo(gx-.015*u,y0-.935*u);g.moveTo(gx+.05*u,y0-.95*u);g.lineTo(gx+.015*u,y0-.935*u);g.moveTo(gx-.025*u,y0-.89*u);g.lineTo(gx+.025*u,y0-.89*u);g.stroke();
  const fx=gx+lerp(.14,.34,wu)*u,fy=y0-lerp(.7,.84,wu)*u;
  g.strokeStyle=suit;g.lineWidth=.06*u;g.beginPath();g.moveTo(gx-.17*u,y0-.8*u);g.lineTo(gx-.12*u,y0-.7*u);g.moveTo(gx+.17*u,y0-.8*u);g.lineTo(fx,fy);g.stroke();
  glove(g,gx-.12*u,y0-.7*u,.065*u,1);if(t<3)glove(g,fx,fy,.065*u,1);
  g.restore();
  if(t>=3&&t<3.6){const p=clamp((t-3)/.35),e=p*p*p,out=t>3.45?clamp((t-3.45)/.15):0,sx=gx+.34*u-camx+W/2,sy=y0-.84*u;
    const r=lerp(.065*u,H*1.25,e)*(1-out*.5);glove(g,lerp(sx,W/2,e),lerp(sy,H*.52,e)+out*H*.6,r,r<H*.3);}
  pun.style.filter=hit?'blur('+((2+2*Math.sin(t*8))*Math.max(0,1-ht/2)).toFixed(1)+'px)':'none';
  if(hit){
    g.fillStyle='rgba(255,255,255,'+Math.max(0,1-ht*4)+')';g.fillRect(0,0,W,H);
    const vg=g.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(90,0,10,'+Math.min(.8,ht)+')');g.fillStyle=vg;g.fillRect(0,0,W,H);
    g.textAlign='center';g.textBaseline='middle';
    if(ht>.3){g.font=Math.round(H*.07)+'px sans-serif';g.fillStyle='#ffd400';for(let i=0;i<6;i++){const a=ht*4+i*1.047;g.fillText('★',W/2+Math.cos(a)*W*.25,H*.3+Math.sin(a)*H*.05);}}
    const q=clamp((ht-.35)/.25),sz=Math.min(W*.28,H*.25);
    if(q>0){g.save();g.globalAlpha=q;g.translate(W/2,H*.5);g.scale(1.6-.6*q,1.6-.6*q);g.rotate(-.08);g.font='900 '+sz+'px "Trebuchet MS",Verdana,sans-serif';
      g.lineJoin='round';g.lineWidth=sz*.14;g.strokeStyle='#000';g.strokeText('K.O.!',0,0);g.fillStyle='#ff3b30';g.fillText('K.O.!',0,0);g.restore();}
  }
  if(t>5.2){g.fillStyle='rgba(0,0,0,'+clamp((t-5.2)/.8)+')';g.fillRect(0,0,W,H);}
}

let prev=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;phaseT+=dt;
  if(celT>=0){celT+=dt;if(celT>=9.9){cel.style.display='none';celT=-1;setAnthem(0);}else drawCel();}
  if(tensT>=0)updTension(dt);
  if(punT>=0){punT+=dt;if(punT>=6)endPunch();else drawPunch();}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,L,L);
  ctx.save();
  if(shake>0.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(0.001,dt);}
  ctx.drawImage(board,0,0,L,L);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*0.5+')';ctx.beginPath();ctx.arc(C,C,346,0,7);ctx.fill();flash-=dt*2.2;}

  stuck.forEach(d=>{
    if(pulling){d.vy+=1500*dt;d.y+=d.vy*dt;d.a=Math.min(1,d.a+dt*2);dart(d.x,d.y,1,1-d.a);}
    else dart(d.x,d.y,1);
  });
  if(pulling){pulling-=dt;if(pulling<=0){pulling=0;stuck=[];}}

  if(phase==='angle'){const a=curAng();cross(C+Math.cos(a)*ORB,C+Math.sin(a)*ORB,'#ff3b30',1.15);}
  else if(phase==='radial'){dashLine();const r=curR();cross(C+Math.cos(lockAng)*r,C+Math.sin(lockAng)*r,'#ff3b30',1.15);}

  if(flight){
    flight.t+=dt;const D=0.55,p=Math.min(1,flight.t/D),e=p*p*p;
    const sx=L*0.95,sy=L*1.3,px=sx+(flight.x-sx)*e,py=sy+(flight.y-sy)*e,sc=1+(1-e)*3.4;
    trail.push({x:px,y:py,s:sc});if(trail.length>9)trail.shift();
    trail.forEach((t,i)=>dart(t.x,t.y,t.s,i/trail.length*0.22));
    dart(px,py,sc);
    cross(flight.x,flight.y,'rgba(255,255,255,'+(0.4+0.6*p)+')',1.3-0.3*p);
    if(p>=1)impact();
  }
  waves.forEach(w=>{w.age+=dt;const r=w.age*340,al=Math.max(0,1-w.age*2.2);
    ctx.strokeStyle=w.col;ctx.globalAlpha=al;ctx.lineWidth=6*al+1;ctx.beginPath();ctx.arc(w.x,w.y,r,0,7);ctx.stroke();ctx.globalAlpha=1;});
  waves=waves.filter(w=>w.age<0.5);
  fx.forEach(p=>{p.life+=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz);});
  ctx.globalAlpha=1;fx=fx.filter(p=>p.life<p.max);
  ctx.textAlign='center';ctx.textBaseline='middle';
  texts.forEach(t=>{t.age+=dt;
    const life=t.big?1.3:0.9,u=t.age/life,sc=t.big?(u<0.15?u/0.15*1.35:1.35-Math.min(0.35,(u-0.15)*0.8)):1;
    ctx.save();ctx.globalAlpha=Math.max(0,1-Math.max(0,u-0.6)/0.4);
    ctx.translate(t.x,t.y-(t.big?0:u*30));ctx.scale(sc,sc);
    ctx.font='900 '+(t.big?64:30)+'px "Trebuchet MS",Verdana,sans-serif';
    ctx.lineWidth=t.big?10:6;ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(t.t,0,0);
    ctx.fillStyle=t.col;ctx.fillText(t.t,0,0);ctx.restore();});
  texts=texts.filter(t=>t.age<(t.big?1.3:0.9));
  ctx.restore();

  if(phase==='endturn'||phase==='won'){
    timer-=dt;
    if(phase==='endturn'&&timer<0.7&&!pulling&&stuck.length)pulling=0.8;
    if(timer<=0){
      if(phase==='won'){$('ovt').textContent='Geschafft in '+total+' Darts! Nochmal?';$('ov').style.display='flex';phase='menu';}
      else{turn=[];turnStart=rem;hud();setPhase('angle');}
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
